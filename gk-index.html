<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GK · Görev Kahramanı</title>
<meta name="theme-color" content="#1F3A93">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gk-style.css?v=13">
</head>
<body class="gk-cocuk">
<div class="gk-sayfa">
  <header class="gk-ust">
    <div>
      <h1 id="gkSelam">Merhaba!</h1>
      <p id="gkTarih"></p>
    </div>
    <button class="gk-toplam" id="gkToplamDugme" aria-label="Toplam puan, geçmişi gör"><b id="gkToplam">0</b><small>puan</small></button>
  </header>

  <nav class="gk-sekmeler" role="tablist">
    <button role="tab" data-sekme="bugun" aria-selected="true">GK · Bugün</button>
    <button role="tab" data-sekme="oduller" aria-selected="false">GK · Ödül ve Cezalar</button>
  </nav>

  <main>
    <section data-panel="bugun">
      <div class="gk-hafta" id="gkHafta"></div>
      <h2 class="gk-baslik" id="gkGunOzet">Bugünün görevleri</h2>
      <ul class="gk-gorevler" id="gkGorevler"></ul>
      <div id="gkHaftalikBolum" hidden>
        <h2 class="gk-baslik gk-baslik-ara" id="gkHaftaOzet">Bu haftanın görevleri</h2>
        <ul class="gk-gorevler" id="gkHaftaGorevler"></ul>
      </div>
    </section>
    <section data-panel="oduller" hidden>
      <div id="gkOdulListe"></div>
    </section>
  </main>

  <div class="gk-pencere" id="gkGecmis" hidden>
    <div class="gk-pencere-kutu" role="dialog" aria-modal="true" aria-labelledby="gkGecmisBaslik">
      <div class="gk-pencere-ust">
        <h2 id="gkGecmisBaslik">Puan geçmişi</h2>
        <button class="gk-kapat" id="gkGecmisKapat" aria-label="Kapat">✕</button>
      </div>
      <div class="gk-pencere-govde" id="gkGecmisIcerik"></div>
    </div>
  </div>

  <footer class="gk-alt"><a href="gk-ebeveyn.html">Ebeveyn girişi</a></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="gk-ayar.js?v=13"></script>
<script src="gk-app.js?v=13"></script>
<script>
const GK_ONCEKI_ETIKET = { hafta: 'Geçen hafta', ay: 'Geçen ay', ceyrek: 'Önceki 3 ay', yariyil: 'Önceki 6 ay' };
let gkYeniDamga = null;

async function gkYenile() {
  try { await gkTumunuYukle(); gkCiz(); }
  catch (e) { gkHata(e); }
}

function gkCiz() {
  const bugun = gkBugun();
  document.getElementById('gkSelam').textContent = `Merhaba ${gk.ayarlar.cocuk_adi}!`;
  document.getElementById('gkTarih').textContent = gkUzunTarih(bugun);
  // Toplam, bu haftanın sonuna kadar hesaplanır: onaylanan haftalık görevler hemen eklenir,
  // gelecek günler ve henüz bitmemiş haftalık görevler ceza yazmaz.
  const haftaSonu = gkDonem('hafta', bugun, gk.ayarlar.hafta_baslangic_gunu).bit;
  const toplam = gkDonemHesapla(gkTarih(gk.ayarlar.baslangic_tarihi), haftaSonu);
  document.getElementById('gkToplam').textContent = toplam.net;
  gkHaftaCiz(bugun);
  gkGorevleriCiz(bugun);
  gkOdulleriCiz(bugun);
}

function gkHaftaCiz(bugun) {
  const odul = gkOduller().find(o => o.aktif && o.donem === 'hafta');
  const esik = odul ? odul.esik_yuzde : 80;
  const donem = gkDonem('hafta', bugun, gk.ayarlar.hafta_baslangic_gunu);
  const h = gkDonemHesapla(donem.bas, donem.bit);
  const hedef = Math.ceil(h.maks * esik / 100);
  const kalan = Math.max(0, hedef - h.net);
  const sonGun = GK_GUNLER[donem.bit.getDay()];
  let not;
  if (h.maks === 0) not = 'Bu hafta için görev yok.';
  else if (kalan === 0) not = 'Hedefe ulaştın! Görevlerini yapmaya devam et 🎉';
  else not = `${sonGun} akşamına kadar ${kalan} puan daha topla` + (odul ? `, ${odul.ad} senin olsun.` : '.');
  document.getElementById('gkHafta').innerHTML = `
    <div class="gk-hafta-ust">
      <h2>Bu hafta</h2>
      <button class="gk-hafta-sayi" data-gecmis="hafta" aria-label="Bu haftanın puan geçmişi">${h.net}<small> / ${hedef} puan</small></button>
    </div>
    ${gkCubuk(h.net, hedef)}
    <p>${gkEsc(not)}</p>
    ${gkGunSeridi(donem, bugun)}`;
}

// ---------- Haftanın gün şeridi ----------
let gkSeritGun = null; // dokunulan günün tarihi

function gkGunDurumu(d, bugunS) {
  const s = gkTarihStr(d);
  if (s > bugunS) return { tur: 'gelecek', yazi: '' };
  const liste = gkGunGorevleri(d);
  if (!liste.length) return { tur: 'bos', yazi: '–' };
  let yapilan = 0, sayilan = 0;
  for (const g of liste) {
    const k = gkKayit(g.id, s);
    if (k && k.durum === 'muaf') continue;
    sayilan++;
    if (k && (k.durum === 'onaylandi' || k.durum === 'bekliyor')) yapilan++;
  }
  if (!sayilan) return { tur: 'bos', yazi: '–' };
  if (yapilan === sayilan) return { tur: 'tam', yazi: '★' };
  if (s === bugunS) return { tur: 'bugun', yazi: `${yapilan}/${sayilan}` };
  if (yapilan === 0) return { tur: 'kotu', yazi: `0/${sayilan}` };
  return { tur: 'yarim', yazi: `${yapilan}/${sayilan}` };
}

function gkGunSeridi(donem, bugun) {
  const bugunS = gkTarihStr(bugun);
  const gunler = [];
  for (let i = 0; i < 7; i++) gunler.push(gkGunEkle(donem.bas, i));
  if (gkSeritGun && !gunler.some(d => gkTarihStr(d) === gkSeritGun)) gkSeritGun = null;

  const kutular = gunler.map(d => {
    const s = gkTarihStr(d);
    const du = gkGunDurumu(d, bugunS);
    const gelecek = du.tur === 'gelecek';
    return `<button class="gk-gun" data-gun="${s}" data-tur="${du.tur}"
        ${s === bugunS ? 'data-bugun="1"' : ''} ${gkSeritGun === s ? 'aria-pressed="true"' : ''}
        ${gelecek ? 'disabled' : ''} aria-label="${gkUzunTarih(d)}">
      <span class="gk-gun-ad">${GK_GUN_KISA[d.getDay()]}</span>
      <span class="gk-gun-isaret">${du.yazi}</span>
    </button>`;
  }).join('');

  return `<div class="gk-serit">${kutular}</div>${gkSeritGun ? gkGunDetayi(gkTarih(gkSeritGun), bugunS) : ''}`;
}

function gkGunDetayi(d, bugunS) {
  const s = gkTarihStr(d);
  const liste = gkGunGorevleri(d);
  const baslik = s === bugunS ? 'Bugün' : gkUzunTarih(d);
  if (!liste.length) return `<div class="gk-detay"><h3>${baslik}</h3><p>Bu gün görev yoktu.</p></div>`;
  const satirlar = liste.map(g => {
    const k = gkKayit(g.id, s);
    let isaret, sonuc, tur;
    if (k && k.durum === 'muaf') { isaret = '–'; sonuc = 'Yoktu'; tur = 'muaf'; }
    else if (k && k.durum === 'onaylandi') { isaret = '✓'; sonuc = `+${k.puan != null ? k.puan : g.puan}`; tur = 'iyi'; }
    else if (k && k.durum === 'bekliyor') { isaret = '⏳'; sonuc = 'Onay bekliyor'; tur = 'bekliyor'; }
    else if (k && k.durum === 'reddedildi') { isaret = '✕'; sonuc = `−${g.ceza}`; tur = 'kotu'; }
    else if (s === bugunS) { isaret = '○'; sonuc = 'Henüz yapılmadı'; tur = 'acik'; }
    else { isaret = '✕'; sonuc = `−${g.ceza}`; tur = 'kotu'; }
    return `<li data-tur="${tur}"><span class="gk-detay-isaret" aria-hidden="true">${isaret}</span>
      <span class="gk-detay-ad">${gkEsc(g.ikon)} ${gkEsc(g.ad)}</span><b>${sonuc}</b></li>`;
  }).join('');
  return `<div class="gk-detay"><h3>${baslik}</h3><ul>${satirlar}</ul></div>`;
}

document.getElementById('gkHafta').addEventListener('click', e => {
  if (e.target.closest('[data-gecmis="hafta"]')) { gkGecmisAc('hafta'); return; }
  const b = e.target.closest('.gk-gun');
  if (!b || b.disabled) return;
  gkSeritGun = gkSeritGun === b.dataset.gun ? null : b.dataset.gun;
  gkHaftaCiz(gkBugun());
});

function gkKart(g, tarihS, not) {
  const k = gkKayit(g.id, tarihS);
  const durum = k ? k.durum : 'acik';
  const etiket = {
    acik: `+${g.puan} puan`,
    bekliyor: 'Onay bekliyor',
    onaylandi: `+${k && k.puan != null ? k.puan : g.puan} kazandın`,
    reddedildi: `−${g.ceza} puan`,
    muaf: g.tip === 'haftalik' ? 'Bu hafta yok' : 'Bugün yok'
  }[durum];
  const damga = { bekliyor: '✓', onaylandi: '★', reddedildi: '✕' }[durum];
  return `<li><button class="gk-gorev" data-id="${g.id}" data-tarih="${tarihS}" data-durum="${durum}">
    <span class="gk-gorev-ikon" aria-hidden="true">${gkEsc(g.ikon)}</span>
    <span class="gk-gorev-ad">${gkEsc(g.ad)}</span>
    ${not ? `<span class="gk-gorev-not">${gkEsc(not)}</span>` : ''}
    <span class="gk-gorev-durum">${etiket}</span>
    ${damga ? `<span class="gk-damga${gkYeniDamga === g.id ? ' yeni' : ''}" aria-hidden="true">${damga}</span>` : ''}
  </button></li>`;
}

function gkHaftalikNot(g, sonGun) {
  if (g.kategori === 'kitap') return `Kitabı bitir, son gün ${sonGun}`;
  if (g.kategori === 'telafi') return `Telafi görevi, son gün ${sonGun}`;
  return `Son gün ${sonGun}`;
}

function gkTamamSayisi(liste, tarihS) {
  return liste.filter(g => { const k = gkKayit(g.id, tarihS); return k && k.durum !== 'reddedildi' && k.durum !== 'muaf'; }).length;
}
function gkSayilanSayisi(liste, tarihS) {
  return liste.filter(g => { const k = gkKayit(g.id, tarihS); return !(k && k.durum === 'muaf'); }).length;
}

function gkGorevleriCiz(bugun) {
  const s = gkTarihStr(bugun);

  // Günlük görevler
  const liste = gkGunGorevleri(bugun);
  const ul = document.getElementById('gkGorevler');
  document.getElementById('gkGunOzet').textContent =
    liste.length ? `Bugünün görevleri (${gkTamamSayisi(liste, s)}/${gkSayilanSayisi(liste, s)})` : 'Bugünün görevleri';
  ul.innerHTML = liste.length
    ? liste.map(g => gkKart(g, s)).join('')
    : '<li class="gk-bos">Bugün için görev yok. Tadını çıkar!</li>';

  // Haftalık görevler
  const haftaBas = gkHaftaBasi(bugun);
  const haftaS = gkTarihStr(haftaBas);
  const haftalik = gkHaftaGorevleri(haftaBas);
  const sonGun = GK_GUNLER[gkGunEkle(haftaBas, 6).getDay()];
  document.getElementById('gkHaftalikBolum').hidden = !haftalik.length;
  document.getElementById('gkHaftaOzet').textContent =
    `Bu haftanın görevleri (${gkTamamSayisi(haftalik, haftaS)}/${gkSayilanSayisi(haftalik, haftaS)})`;
  document.getElementById('gkHaftaGorevler').innerHTML =
    haftalik.map(g => gkKart(g, haftaS, gkHaftalikNot(g, sonGun))).join('');

  gkYeniDamga = null;
}

function gkOdulleriCiz(bugun) {
  const hb = gk.ayarlar.hafta_baslangic_gunu;
  const kutu = document.getElementById('gkOdulListe');
  const liste = gkOdullerSirali(gkOduller().filter(o => o.aktif));
  if (!liste.length) {
    kutu.innerHTML = gkTakvimHtml() + '<p class="gk-bos">Henüz ödül eklenmedi.</p>' + gkDikkatHtml(bugun);
    return;
  }
  kutu.innerHTML = gkTakvimHtml() + liste.map(o => {
    const donem = gkDonem(o.donem, bugun, hb);
    const d = gkOdulDurumu(o, donem);
    const kalan = Math.max(0, d.hedef - d.net);

    let oncekiNot = '';
    const onceki = gkOncekiDonem(o.donem, donem, hb);
    if (gkTarihStr(onceki.bit) >= gk.ayarlar.baslangic_tarihi) {
      const od = gkOdulDurumu(o, onceki);
      const et = GK_ONCEKI_ETIKET[o.donem];
      if (od.maks > 0) {
        if (od.teslim) oncekiNot = `<p class="gk-not iyi">${et}: ödülünü aldın 🎉</p>`;
        else if (od.kazandi) oncekiNot = `<p class="gk-not iyi">${et}: kazandın! Ödülün seni bekliyor 🎁</p>`;
        else if (od.bekleyen) oncekiNot = `<p class="gk-not">${et}: sonuç onay bekliyor</p>`;
        else oncekiNot = `<p class="gk-not">${et}: hedefe ulaşamadın (${od.net}/${od.hedef} puan)</p>`;
      }
    }

    return `<article class="gk-odul${d.kazandi ? ' kazanildi' : ''}">
      <span class="gk-odul-ikon" aria-hidden="true">${gkEsc(o.ikon)}</span>
      <div class="gk-odul-govde">
        <h3>${gkEsc(o.ad)}</h3>
        <p class="gk-not">${GK_DONEM_ETIKET[o.donem]} ödül, ${gkDonemAdi(o.donem, donem)}</p>
        ${gkCubuk(d.net, d.hedef)}
        <p><b>${d.net}</b> / ${d.hedef} puan${kalan ? `, ${kalan} puan kaldı` : ', hedefe ulaştın!'}</p>
        ${o.aciklama ? `<p class="gk-not">${gkEsc(o.aciklama)}</p>` : ''}
        ${oncekiNot}
      </div>
    </article>`;
  }).join('') + gkDikkatHtml(bugun);
}

// ---------- Cezalar (Dikkat kartları) ----------
function gkDikkatHtml(bugun) {
  const hb = gk.ayarlar.hafta_baslangic_gunu;
  const liste = gkOdullerSirali(gkCezalar().filter(o => o.aktif));
  if (!liste.length) return '';
  return '<h2 class="gk-baslik gk-baslik-ara">Dikkat</h2>' + liste.map(o => {
    const donem = gkDonem(o.donem, bugun, hb);
    const yuzde = gkGidisat(donem);
    let durum;
    if (yuzde === null) durum = '<p class="gk-not">Dönem yeni başladı.</p>';
    else if (yuzde >= o.esik_yuzde) durum = `<p class="gk-not iyi">Şu ana kadar %${Math.max(0, yuzde)}, güvendesin ✓</p>`;
    else durum = `<p class="gk-uyari">Şu ana kadar %${Math.max(0, yuzde)}. Görevlerini yaparak %${o.esik_yuzde}'in üstüne çık!</p>`;

    let oncekiNot = '';
    const onceki = gkOncekiDonem(o.donem, donem, hb);
    if (gkTarihStr(onceki.bit) >= gk.ayarlar.baslangic_tarihi) {
      const od = gkOdulDurumu(o, onceki);
      if (od.maks > 0 && od.dustu) oncekiNot = `<p class="gk-not">${GK_ONCEKI_ETIKET[o.donem]}: hedefin altında kaldın, telafi görevin var.</p>`;
    }

    return `<article class="gk-odul gk-ceza">
      <span class="gk-odul-ikon" aria-hidden="true">${gkEsc(o.ikon)}</span>
      <div class="gk-odul-govde">
        <h3>${gkEsc(o.ad)}</h3>
        <p class="gk-not">${GK_DONEM_ETIKET[o.donem]} başarı %${o.esik_yuzde}'in altında kalırsa telafi görevi olarak gelir.</p>
        ${durum}
        ${oncekiNot}
      </div>
    </article>`;
  }).join('');
}

async function gkKartTikla(e) {
  const b = e.target.closest('.gk-gorev');
  if (!b || b.disabled) return;
  const id = Number(b.dataset.id);
  const tarih = b.dataset.tarih;
  const durum = b.dataset.durum;
  if (durum === 'onaylandi') { gkMesaj('Bu görev onaylandı, aferin!'); return; }
  if (durum === 'reddedildi') { gkMesaj('Bu görev yapılmadı olarak işaretlendi.'); return; }
  if (durum === 'muaf') { gkMesaj('Bu görev bu sefer yok, puanını etkilemez.'); return; }
  if (durum === 'bekliyor' && !confirm('İşareti geri almak istiyor musun?')) return;
  b.disabled = true;
  try {
    if (durum === 'acik') {
      await gkIsaretle(id, tarih);
      gkYeniDamga = id;
      gkMesaj('Harika! Şimdi onay bekliyor.');
    } else {
      await gkIsaretKaldir(id, tarih);
    }
  } catch (err) {
    gkHata(err);
  }
  await gkYenile();
}
// ---------- Puan geçmişi penceresi ----------
function gkGecmisAc(kapsam) {
  const bugun = gkBugun();
  const hafta = gkDonem('hafta', bugun, gk.ayarlar.hafta_baslangic_gunu);
  const bas = kapsam === 'hafta' ? hafta.bas : gkTarih(gk.ayarlar.baslangic_tarihi);
  const { satirlar, bekleyen } = gkPuanHareketleri(bas, hafta.bit);

  const kazanilan = satirlar.filter(x => x.puan > 0).reduce((a, x) => a + x.puan, 0);
  const dusen = satirlar.filter(x => x.puan < 0).reduce((a, x) => a + x.puan, 0);
  const toplam = kazanilan + dusen;
  const isaretli = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

  // Günlere göre grupla, en yeni gün üstte
  const gunler = new Map();
  for (const x of satirlar) {
    if (!gunler.has(x.tarih)) gunler.set(x.tarih, []);
    gunler.get(x.tarih).push(x);
  }
  const sirali = [...gunler.keys()].sort().reverse();

  let h = `<p class="gk-gecmis-kapsam">${kapsam === 'hafta'
    ? 'Bu hafta, ' + gkDonemAdi('hafta', hafta)
    : gkUzunTarih(gkTarih(gk.ayarlar.baslangic_tarihi)) + ' tarihinden bu yana'}</p>
    <div class="gk-gecmis-ozet">
      <div><small>Kazanılan</small><b class="arti">+${kazanilan}</b></div>
      <div><small>Düşen</small><b class="eksi">${isaretli(dusen)}</b></div>
      <div><small>Toplam</small><b>${toplam}</b></div>
    </div>`;
  if (bekleyen) h += `<p class="gk-not">${bekleyen} görev onay bekliyor, onaylanınca buraya eklenecek.</p>`;
  if (!satirlar.length) h += '<p class="gk-not">Henüz puan hareketi yok.</p>';

  for (const t of sirali) {
    const liste = gunler.get(t);
    const gunToplam = liste.reduce((a, x) => a + x.puan, 0);
    h += `<section class="gk-gecmis-gun">
      <h3><span>${t === gkTarihStr(bugun) ? 'Bugün' : gkUzunTarih(gkTarih(t))}</span>
        <span class="${gunToplam >= 0 ? 'arti' : 'eksi'}">${isaretli(gunToplam)}</span></h3>
      <ul>${liste.map(x => `<li>
        <span class="gk-gecmis-ad">${gkEsc(x.gorev.ikon)} ${gkEsc(x.gorev.ad)}<small>${x.aciklama}</small></span>
        <b class="${x.puan >= 0 ? 'arti' : 'eksi'}">${isaretli(x.puan)}</b>
      </li>`).join('')}</ul>
    </section>`;
  }

  document.getElementById('gkGecmisBaslik').textContent = kapsam === 'hafta' ? 'Bu haftanın puanları' : 'Puan geçmişi';
  document.getElementById('gkGecmisIcerik').innerHTML = h;
  const p = document.getElementById('gkGecmis');
  p.hidden = false;
  document.body.classList.add('gk-kilitli');
  document.getElementById('gkGecmisKapat').focus();
}
function gkGecmisKapat() {
  document.getElementById('gkGecmis').hidden = true;
  document.body.classList.remove('gk-kilitli');
}
document.getElementById('gkToplamDugme').addEventListener('click', () => gkGecmisAc('tumu'));
document.getElementById('gkGecmisKapat').addEventListener('click', gkGecmisKapat);
document.getElementById('gkGecmis').addEventListener('click', e => { if (e.target.id === 'gkGecmis') gkGecmisKapat(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('gkGecmis').hidden) gkGecmisKapat(); });

document.getElementById('gkGorevler').addEventListener('click', gkKartTikla);
document.getElementById('gkHaftaGorevler').addEventListener('click', gkKartTikla);

gkSekmeKur();
gkYenile();
setInterval(gkYenile, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) gkYenile(); });
